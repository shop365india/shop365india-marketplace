<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Requirement - SHOP365 INDIA</title>

<link rel="stylesheet" href="style.css">

<style>
.container{
max-width:700px;
margin:60px auto;
padding:30px;
background:#fff;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.container h2{
text-align:center;
color:#0b4ea2;
margin-bottom:10px;
}

.container p{
text-align:center;
color:#666;
margin-bottom:25px;
}

.container input,
.container textarea,
.container select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.container button{
width:100%;
padding:14px;
background:#0b4ea2;
color:#fff;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

.container button:hover{
background:#083a7d;
}
</style>

</head>

<body>

<div style="background:#0b4ea2;padding:15px;">
<a href="index.html" style="color:white;text-decoration:none;font-size:22px;font-weight:bold;">
← SHOP365 INDIA
</a>
</div>

<div class="container">

<h2>Post Your Requirement</h2>

<p>Tell us what product you need and our sellers will contact you.</p>

<form id="requirementForm">

<input type="text" name="product" placeholder="Product Name" required>

<input type="number" name="quantity" placeholder="Required Quantity" required>

<input type="text" name="city" placeholder="City" required>

<input type="text" name="mobile" placeholder="Mobile Number" required>

<input type="email" name="email" placeholder="Email Address">

<textarea name="details" rows="5" placeholder="Requirement Details"></textarea>

<button type="submit">Submit Requirement</button>

</form>

</div>
<script src="script.js"></script>
</body>
</html>
