<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become Seller - SHOP365 INDIA</title>

<link rel="stylesheet" href="style.css">

<style>
.container{
max-width:700px;
margin:60px auto;
padding:30px;
background:#fff;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.container h2{
text-align:center;
margin-bottom:25px;
color:#0b4ea2;
}

.container input,
.container textarea,
.container select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.container button{
width:100%;
padding:14px;
background:#0b4ea2;
color:#fff;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

.container button:hover{
background:#083a7d;
}
</style>

</head>

<body>
<div style="background:#0b4ea2;padding:15px;">
    <a href="index.html" style="color:white;text-decoration:none;font-size:22px;font-weight:bold;">
        ← SHOP365 INDIA
    </a>
</div>
<div class="container">

<h2>Become a Seller</h2>
<p style="text-align:center;color:#666;margin-bottom:25px;">
Join SHOP365 INDIA and start selling your products across India.
</p>
<form>

<input type="text" placeholder="Company Name" required>

<input type="text" placeholder="Contact Person" required>

<input type="text" placeholder="Mobile Number" required>

<input type="email" placeholder="Email Address">

<input type="text" placeholder="GST Number">
<input type="text" placeholder="Business Address">
<input type="text" placeholder="City">
<input type="text" placeholder="State">

<option>Select Product Category</option>
<option>Electrical</option>
<option>Industrial</option>
<option>Hardware</option>
<option>Safety</option>
<option>Automobile</option>
<option>Home & Kitchen</option>
<option>Others</option>
</select>

<textarea rows="5" placeholder="Describe your business"></textarea>

<button type="submit">Register Now</button>

</form>

</div>

</body>
</html>
